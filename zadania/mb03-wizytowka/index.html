<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        Vadym Bondaruk. jedno zdanie o sobie.
    </header>
    <nav>
        <a href="#o-mnie">o mnie</a>
        <a href="#umietnosci">umiejętności</a>
        <a href="#kontakt">kontakt</a>
    </nav>
    <main>
        <section id="o-mnie"></section>
        <section id="umietnosci">
            <ul id="lista-umietnosci"></ul>
        </section>
        <section id="kontakt">
            <form>
                <label for="imie">Imię:</label>
                <input type="text" name="imie" placeholder="Imię">
                <label for="email">Email:</label>
                <input type="email" name="email" placeholder="Email">
                <label for="temat">Temat:</label>
                <select name="temat">
                    <option value="question">Pytanie</option>
                    <option value="feedback">Opinia</option>
                    <option value="other">Inne</option>
                </select>
                <label for="tresc">Wiadomość:</label>
                <textarea name="tresc" placeholder="Wiadomość"></textarea>
                <button type="submit">Wyślij</button>
            </form>
        </section>
    </main>
    <footer>2026 zadanie z przedmiotu programowanie webowe zaawansowane</footer>
    <script src="script.js"></script>
</body>
</html>
